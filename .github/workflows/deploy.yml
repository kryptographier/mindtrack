name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          # Public values only — see .env.example and
          # docs/architecture.md on why these are safe to expose.
          # The service-role key is NEVER referenced here.
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_PROJECT_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          # Must match the repository name so the SPA routing fix
          # (frontend/index.html + public/404.html) resolves paths
          # correctly under https://<user>.github.io/<repo>/.
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Confirm no secrets leaked into the build output
        run: |
          if grep -r "SERVICE_ROLE\|service_role\|CLEANUP_SECRET" dist/ 2>/dev/null; then
            echo "::error::Potential secret reference found in build output — aborting deploy"
            exit 1
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
